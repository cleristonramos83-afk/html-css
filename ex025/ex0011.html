<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário completo</title>
</head>
<body>
    <h1>Preencha o formulário</h1>
    <form action="cadastro.php" method="post" autocomplete="on">

        <p>
            <label for="inome">Nome completo:</label>
            <input type="text" name="nome" id="inome" placeholder="Nome do usuário" required minlength="20" maxlength="50">
        </p>
        <p>
            <label for="isenha">Digite sua senha:</label>
            <input type="password" name="senha" id="isenha" placeholder="Senha do usuário" required minlength="12" maxlength="12">
        </p>
        <p>
            <label for="imes">Mês:</label>
            <input type="month" name="mes" id="imes" required>
        </p>
        <p>
             <label for="ihora">Horário:</label>
                <input type="time" name="hora" id="ihora" required>
        </p>
        <p>
            <label for="inumero">Número:</label>
            <input type="number" name="numero" id="inumero"  min="0" max="10" placeholder="0 a 10" step="0.1"  value="5" required>
        </p>
        <p>
            <label for="idia">Dia:</label>
            <input type="date" name="dia" id="idia">
        </p>
        <p>
            <label for="imail">Digite seu E-mail:</label>
            <input type="email" name="email" id="imail" required placeholder="e-mail" maxlength="20" minlength="12">
        </p>
        <p>
            <label for="itel">Telefone:</label>
            <input type="tel" name="telefone" id="itel" required autocomplete="tel"  pattern="^\d{4,5}-\d{4,5}$">
        </p>
        <p>
            <legend>Qual seu animal favorito?</legend>
            <label for="iradio">Gatos</label>
            <input type="radio" name="radio" id="iradio" required>
            <label for="iadio">Cachorros</label>
            <input type="radio" name="radio" id="iadio" required>
            <label for="idio">Os dois</label>
            <input type="radio" name="radio" id="idio" required>
        </p>
        <p>
            <label for="icor">Escolha uma cor:</label>
            <input type="color" name="cor" id="icor">
        </p>
        <p>
             <label for="iano">Data de nascimento</label>
            <input type="number" name="ano" id="iano" min="1800" max="2026" oninput="calcIdade()">
        </p>
        <p>
            <label for="iidade">Idade:</label>
            <output id="iidade">0</output>
        </p>
        <p>
            <input type="submit" value="Enviar!">
            <input type="reset" value="Limpar!">
        </p>
    </form>

    <script>
      function calcIdade() {

            let atual = new Date().getFullYear()
            iidade.innerHTML = Number(atual) - Number (iano.value)
        }
    </script>
</body>
</html>
