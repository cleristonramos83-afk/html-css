<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulários</title>
</head>
<body>
    <h1>Exemplo de Formulário</h1>
    <form action="cadastro.php" method="get" autocomplete="on">
        <fieldset>

            <legend>Dados pessoais</legend>
            <p>
                <label for="inome">Nome:</label>
                <input type="text" name="nome" id="inome" maxlength="20" minlength="5">
            </p>
            <p>
                <label for="i-mail">Insira seu e-mail:</label>
                <input type="email" name="e-mail" id="i-mail" autocomplete="email" >
            </p>
            <p>
                <label for="itel">Insira seu númreo de telefone:</label>
                <input type="tel" name="tel" id="itel" required autocomplete="tel"  pattern="^\d{4,5}-\d{4,5}$">
            </p>
        </fieldset>
        <p>
            <input type="submit" value="Enviar!">
            <input type="reset" value="Limpar!">
        </p>
    </form>
</body>
</html>
