<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulários</title>
</head>
<body>
     <h1>Exemplos de formulário</h1>
    <form action="cadastro.php" method="get">

        <p>
            <label for="iano">Data de nascimento</label>
            <input type="number" name="ano" id="iano" min="1900" max="2026" oninput="calcIdade()">
        </p>
        <p>
            <label for="iidade">Idade:</label>
            <output id="iidade">0</output>
        </p>
       <p>
            <input type="submit" value="ENVIAR!">
            <input type="reset" value="LIMPAR!">
        </p>
    </form>

    <script>
        function calcIdade() {

            let atual = new Date().getFullYear()
            iidade.innerHTML = Number(atual) - Number (iano.value)
        }
    </script>
</body>
</html>
