<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela</title>
    <style>
        body{
            font-family: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
        }

        table{
            width: 500px;
            text-align: center;
        }
        td{
            border: 1px solid black;
            height: 50px;

        }
    </style>
</head>
<body>
    <table>
        <tr>
            <td colspan="4">a</td>
             <td rowspan="5">b</td>
           
            
        </tr>

    

        <tr>
            <td rowspan="5">c</td>
        </tr>
        <td>d</td>
        <td>e</td>
        <td>f</td>
        <tr>
            <td>g</td>
            <td>h</td>
            <td>i</td>
        </tr>
        <tr>
            <td>j</td>
            <td>l</td>
            <td>m</td>
            
        </tr>
       
        <tr>
        <td colspan="4">n</td>
        </tr>
    </table>
</body>
</html>
