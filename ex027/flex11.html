<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Testando flexbox</title>
    <style>
        div.conteiner{
            background-color: darkmagenta;
            display: flex;
            flex-flow: row nowrap;
        }

        div.filho{
            background-color: blueviolet;
            border: 1px solid darkblue;
            text-align: center;

            flex-basis: 250px;
           
        }

        div#cxA{
            flex-shrink: 0;
            flex-grow: 0;
            flex-basis: 200px;

            flex: 0 0 200px;
        }
           div#cxB{
            flex-grow: 0;
            flex-shrink: 1;

            flex: 0,1,150px;
        }
           div#cxC{
            flex-shrink: 0;
            flex-grow: 0;

            flex: 0,auto;
        }
    </style>
</head>
<body>
    <div class="conteiner">
        <div class="filho" id="cxA">a</div>
        <div class="filho" id="cxB">b</div>
        <div class="filho" id="cxD">c</div>
    </div>
</body>
</html>
