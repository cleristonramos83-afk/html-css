<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Testando flexbox</title>
    <style>
        div.conteiner{
            background-color: darkmagenta;
            display: flex;
            flex-flow: row wrap;
        }

        div.filho{
            background-color: blueviolet;
            border: 1px solid darkblue;
            text-align: center;
            padding: 20px;
        }

        div#i1{
            order: 0;
        }
          div#i2{
            order: -2;
        }
          div#i3{
            order: 4;
        }
          div#i4{
            order: 9;
        }
          div#i5{
            order: 5;
        }
          div#i6{
            order: 234;
        }
          div#i7{
            order: 7;
        }
    </style>
</head>
<body>
    <div class="conteiner">
        <div class="filho" id="i1">a</div>
        <div class="filho" id="i2">b</div>
        <div class="filho" id="i3">c</div>
        <div class="filho" id="i4">d</div>
        <div class="filho" id="i5">e</div>
        <div class="filho" id="i6">f</div>
        <div class="filho" id="i7">g</div>
    </div>
</body>
</html>
