<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Exercicio de Tabelas</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }
        table{
            width: 500px;
            border-collapse: collapse;
        }
        caption{

            font-size: 1.3em;
            font-weight: bolder;
            padding: 5;
        }

        th , td{

            border: 1px solid black;
            padding: 8px;
        }

     col.cnome{

        background-color: limegreen;
     }

     col.cgrupo{

        background-color: lightpink;
     }

     col.cprof {

        background-color: lightgreen;
     }
    </style>
</head>
<body>
    <h1>Exercicio de Tabelas</h1>

    <table>

        <colgroup>
            <col class="cnome">
            <col class="cgrupo" span="2">
            <col class="cprof">
        </colgroup>


        <caption>Cadastro</caption>

        <tr>
            <th scope="col" >Nome</th>
            <th scope="col">Sexo</th>
            <th scope="col">Idade</th>
            <th scope="col">Profissão</th>
        </tr>

        <tr>
            <td>Ana Maria</td>
            <td>F</td>
            <td>50</td>
            <td>Médica</td>
        </tr>
        <tr>
            <td >Carlos</td>
            <td>M</td>
            <td>23</td>
            <td>Youtuber</td>
        </tr>
        <tr>
            <td>Roberta</td>
            <td>F</td>
            <td>33</td>
            <td>Recpcionista</td>
        </tr>
        <tr>
            <td>Rafael</td>
            <td>M</td>
            <td>48</td>
            <td>Professor</td>
        </tr>
        <tr>
            <td>Leandro</td>
            <td>M</td>
            <td>20</td>
            <td>veterinário</td>
        </tr>

        <tr>
            <td>Luiza</td>
            <td>F</td>
            <td>78</td>
            <td>cozinheira</td>
        </tr>
    </table>
</body>
</html>
