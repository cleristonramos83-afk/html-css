<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }

        table{

            width: 400px;
            padding: 10px;
            margin: 2;
        }

        th , td{

            border: 1px solid black;
            border-collapse: collapse;
        }
    </style>
   
</head>
<body>
   <table>

<thead>
    <tr>
        <th scope="col">Àrea</th>
        <th scope="col">Matéria</th>
        <th scope="col">Notas</th>
        <th scope="col">Notas 1 </th>
        <th scope="col">Notas 2</th>
       
        
    </tr>
</thead>

<tbody>
    <tr>
         <th scope="row" rowspan="4">Exatas</th>
         
         <td>Matemática</td>
         <td>26</td>
         <td>10</td>
         <td>16</td>
      
    </tr>
   
    <tr>
        <td>Química</td>
        <td>18</td>
        <td>10</td>
        <td>8</td>
    </tr>

    <tr>
        <td>Física</td>
        <td>9</td>
        <td>0.0</td>
        <td>9</td>
    </tr>

    <tr>
        <td>Biologia</td>
        <td>15</td>
        <td>10</td>
        <td>5</td>
    </tr>

    <tr>
        <th scope="row" rowspan="2">Outras Matérias</th>

        <td>Geografia</td>
        <td>30</td>
        <td>20</td>
        <td>10</td>
    </tr>

    <tr>
        <td>História</td>
        <td>23</td>
        <td>10</td>
        <td>13</td>
    </tr>
</tbody>
  
   </table>
</body>
</html>
